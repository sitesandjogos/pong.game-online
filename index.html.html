<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong Online</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
    padding: 20px;
  }

  h1 {
    letter-spacing: 12px;
    font-size: 2.2rem;
    margin-bottom: 4px;
    text-shadow: 0 0 10px #fff, 0 0 20px #fff;
  }

  .subtitle {
    color: #888;
    margin-bottom: 20px;
    letter-spacing: 3px;
    font-size: 0.75rem;
  }

  /* ---------- LOBBY ---------- */
  #lobby {
    border: 2px solid #fff;
    padding: 30px 40px;
    max-width: 460px;
    width: 100%;
    text-align: center;
  }

  #lobby h2 {
    letter-spacing: 3px;
    font-size: 1rem;
    margin-bottom: 20px;
    color: #ccc;
  }

  .lobby-section {
    margin-bottom: 25px;
    padding-bottom: 25px;
    border-bottom: 1px dashed #444;
  }
  .lobby-section:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .btn {
    background: #000;
    color: #fff;
    border: 2px solid #fff;
    padding: 10px 24px;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: #fff; color: #000; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  input[type="text"] {
    background: #111;
    border: 2px solid #555;
    color: #fff;
    padding: 8px 10px;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    letter-spacing: 1px;
    width: 100%;
    margin-bottom: 12px;
    text-align: center;
  }
  input[type="text"]:focus { outline: none; border-color: #fff; }

  #myIdDisplay {
    background: #111;
    border: 2px solid #0f0;
    color: #0f0;
    padding: 12px;
    font-size: 1.1rem;
    letter-spacing: 3px;
    margin: 12px 0;
    word-break: break-all;
    cursor: pointer;
  }

  .status {
    margin-top: 12px;
    font-size: 0.8rem;
    color: #ff0;
    min-height: 18px;
    letter-spacing: 1px;
  }

  /* ---------- GAME ---------- */
  #gameWrap { display: none; flex-direction: column; align-items: center; }

  .score-board {
    display: flex;
    justify-content: space-between;
    width: 800px;
    max-width: 95vw;
    margin-bottom: 10px;
    font-size: 1.4rem;
    letter-spacing: 3px;
  }

  #gameCanvas {
    background: #000;
    border: 3px solid #fff;
    box-shadow: 0 0 25px rgba(255,255,255,0.3);
    max-width: 95vw;
  }

  .container { position: relative; display: flex; flex-direction: column; align-items: center; }

  .overlay-msg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 1.1rem;
    letter-spacing: 3px;
    text-align: center;
    pointer-events: none;
    display: none;
    background: rgba(0,0,0,0.7);
    padding: 15px 25px;
  }

  .instructions {
    margin-top: 15px;
    color: #666;
    font-size: 0.8rem;
    text-align: center;
  }
  .instructions span { color: #fff; }

  .role-badge {
    font-size: 0.75rem;
    color: #0af;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<h1>PONG</h1>
<div class="subtitle">— MULTIPLAYER ONLINE —</div>

<!-- LOBBY -->
<div id="lobby">
  <h2>CRIAR UMA SALA</h2>
  <div class="lobby-section">
    <button class="btn" id="createBtn">CRIAR SALA</button>
    <div id="myIdDisplay" style="display:none;"></div>
    <div style="font-size:0.7rem;color:#888;" id="createHint"></div>
  </div>

  <h2>ENTRAR EM UMA SALA</h2>
  <div class="lobby-section">
    <input type="text" id="joinInput" placeholder="COLE O CÓDIGO DA SALA AQUI">
    <button class="btn" id="joinBtn">ENTRAR</button>
  </div>

  <div class="status" id="statusMsg"></div>
</div>

<!-- GAME -->
<div id="gameWrap">
  <div class="role-badge" id="roleBadge"></div>
  <div class="score-board">
    <div>VOCÊ: <span id="scoreMe">0</span></div>
    <div>OPONENTE: <span id="scoreOpp">0</span></div>
  </div>
  <div class="container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="overlay-msg" id="overlayMsg"></div>
  </div>
  <div class="instructions">
    Mova sua raquete com <span>W</span>/<span>S</span> ou <span>↑</span>/<span>↓</span> — Primeiro a <span>7 pontos</span> vence
  </div>
</div>

<script>
/* =========================================================
   ESTADO GERAL / CONEXÃO P2P (PeerJS)
   ========================================================= */
let peer = null;
let conn = null;
let isHost = false;
let connected = false;

const lobby = document.getElementById('lobby');
const gameWrap = document.getElementById('gameWrap');
const statusMsg = document.getElementById('statusMsg');
const myIdDisplay = document.getElementById('myIdDisplay');
const createHint = document.getElementById('createHint');
const roleBadge = document.getElementById('roleBadge');

document.getElementById('createBtn').addEventListener('click', createRoom);
document.getElementById('joinBtn').addEventListener('click', joinRoom);

function setStatus(text, color) {
  statusMsg.textContent = text;
  statusMsg.style.color = color || '#ff0';
}

function createRoom() {
  document.getElementById('createBtn').disabled = true;
  setStatus('GERANDO SALA...', '#ff0');
  peer = new Peer(); // usa servidor público de sinalização do PeerJS

  peer.on('open', (id) => {
    isHost = true;
    myIdDisplay.style.display = 'block';
    myIdDisplay.textContent = id;
    createHint.textContent = 'Envie este código para seu amigo (clique para copiar)';
    myIdDisplay.addEventListener('click', () => {
      navigator.clipboard.writeText(id).then(() => {
        createHint.textContent = 'CÓDIGO COPIADO!';
      });
    });
    setStatus('AGUARDANDO OPONENTE...', '#0af');
  });

  peer.on('connection', (c) => {
    conn = c;
    setupConnection();
  });

  peer.on('error', (err) => {
    setStatus('ERRO: ' + err.type, '#f33');
    document.getElementById('createBtn').disabled = false;
  });
}

function joinRoom() {
  const targetId = document.getElementById('joinInput').value.trim();
  if (!targetId) {
    setStatus('DIGITE UM CÓDIGO VÁLIDO', '#f33');
    return;
  }
  document.getElementById('joinBtn').disabled = true;
  setStatus('CONECTANDO...', '#ff0');

  peer = new Peer();
  peer.on('open', () => {
    isHost = false;
    conn = peer.connect(targetId, { reliable: true });
    setupConnection();
  });

  peer.on('error', (err) => {
    setStatus('ERRO: ' + err.type, '#f33');
    document.getElementById('joinBtn').disabled = false;
  });
}

function setupConnection() {
  conn.on('open', () => {
    connected = true;
    setStatus('CONECTADO! INICIANDO JOGO...', '#0f0');
    setTimeout(startOnlineGame, 600);
  });

  conn.on('data', handleData);

  conn.on('close', () => {
    connected = false;
    setStatus('OPONENTE DESCONECTOU', '#f33');
    running = false;
    showOverlay('OPONENTE DESCONECTOU');
  });

  conn.on('error', () => {
    setStatus('ERRO NA CONEXÃO', '#f33');
  });
}

/* =========================================================
   JOGO
   ========================================================= */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreMeEl = document.getElementById('scoreMe');
const scoreOppEl = document.getElementById('scoreOpp');
const overlayMsg = document.getElementById('overlayMsg');

const W = canvas.width;
const H = canvas.height;
const PADDLE_W = 12;
const PADDLE_H = 80;
const PADDLE_SPEED = 6;
const BALL_SIZE = 12;
const WIN_SCORE = 7;

// Host controla a física oficial. Cliente só manda a posição da própria raquete
// e recebe o estado completo do host.
let hostPaddle = { y: H/2 - PADDLE_H/2 };
let clientPaddle = { y: H/2 - PADDLE_H/2 };
let ball = { x: W/2, y: H/2, dx: 5, dy: 3 };
let scoreHost = 0;
let scoreClient = 0;
let running = false;
let animId = null;

const keys = {};
document.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

function myPaddleMove() {
  let dy = 0;
  if (keys['w'] || keys['arrowup']) dy = -PADDLE_SPEED;
  else if (keys['s'] || keys['arrowdown']) dy = PADDLE_SPEED;

  if (isHost) {
    hostPaddle.y = clamp(hostPaddle.y + dy, 0, H - PADDLE_H);
  } else {
    clientPaddle.y = clamp(clientPaddle.y + dy, 0, H - PADDLE_H);
  }
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

function handleData(data) {
  if (!isHost && data.type === 'state') {
    // cliente recebe estado completo do host
    hostPaddle.y = data.hostY;
    ball.x = data.ballX;
    ball.y = data.ballY;
    scoreHost = data.scoreHost;
    scoreClient = data.scoreClient;
    updateScoreDisplay();
    if (data.gameOver) {
      running = false;
      showOverlay(data.winnerIsHost ? 'OPONENTE VENCEU!' : 'VOCÊ VENCEU!');
    }
  } else if (isHost && data.type === 'input') {
    clientPaddle.y = clamp(data.y, 0, H - PADDLE_H);
  }
}

function resetBall(direction) {
  ball.x = W / 2;
  ball.y = H / 2;
  ball.dx = 5 * direction;
  ball.dy = (Math.random() * 6 - 3) || 3;
}

function updateScoreDisplay() {
  if (isHost) {
    scoreMeEl.textContent = scoreHost;
    scoreOppEl.textContent = scoreClient;
  } else {
    scoreMeEl.textContent = scoreClient;
    scoreOppEl.textContent = scoreHost;
  }
}

function hostUpdate() {
  // física só roda no host
  ball.x += ball.dx;
  ball.y += ball.dy;

  if (ball.y - BALL_SIZE/2 <= 0 || ball.y + BALL_SIZE/2 >= H) ball.dy *= -1;

  // colisão paddle host (esquerda)
  if (ball.x - BALL_SIZE/2 <= 30 + PADDLE_W && ball.x - BALL_SIZE/2 >= 30 &&
      ball.y >= hostPaddle.y && ball.y <= hostPaddle.y + PADDLE_H) {
    ball.dx = Math.abs(ball.dx) * 1.05;
    const hitPos = (ball.y - (hostPaddle.y + PADDLE_H/2)) / (PADDLE_H/2);
    ball.dy = hitPos * 6;
  }

  // colisão paddle cliente (direita)
  const cx = W - 30 - PADDLE_W;
  if (ball.x + BALL_SIZE/2 >= cx && ball.x + BALL_SIZE/2 <= cx + PADDLE_W &&
      ball.y >= clientPaddle.y && ball.y <= clientPaddle.y + PADDLE_H) {
    ball.dx = -Math.abs(ball.dx) * 1.05;
    const hitPos = (ball.y - (clientPaddle.y + PADDLE_H/2)) / (PADDLE_H/2);
    ball.dy = hitPos * 6;
  }

  let gameOver = false;
  let winnerIsHost = false;

  if (ball.x < 0) {
    scoreClient++;
    if (scoreClient >= WIN_SCORE) { gameOver = true; winnerIsHost = false; }
    else resetBall(1);
  } else if (ball.x > W) {
    scoreHost++;
    if (scoreHost >= WIN_SCORE) { gameOver = true; winnerIsHost = true; }
    else resetBall(-1);
  }

  updateScoreDisplay();

  if (conn && connected) {
    conn.send({
      type: 'state',
      hostY: hostPaddle.y,
      ballX: ball.x,
      ballY: ball.y,
      scoreHost, scoreClient,
      gameOver, winnerIsHost
    });
  }

  if (gameOver) {
    running = false;
    showOverlay(winnerIsHost ? 'VOCÊ VENCEU!' : 'OPONENTE VENCEU!');
  }
}

function drawRect(x, y, w, h, color = '#fff') {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}
function drawCircle(x, y, r, color = '#fff') {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}
function drawNet() {
  ctx.strokeStyle = '#555';
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.setLineDash([]);
}

function draw() {
  drawRect(0, 0, W, H, '#000');
  drawNet();
  drawRect(30, hostPaddle.y, PADDLE_W, PADDLE_H);
  drawRect(W - 30 - PADDLE_W, clientPaddle.y, PADDLE_W, PADDLE_H);
  drawCircle(ball.x, ball.y, BALL_SIZE/2);
}

function showOverlay(text) {
  overlayMsg.textContent = text;
  overlayMsg.style.display = 'block';
}
function hideOverlay() { overlayMsg.style.display = 'none'; }

function loop() {
  if (!running) return;
  myPaddleMove();

  if (isHost) {
    hostUpdate();
  } else if (conn && connected) {
    conn.send({ type: 'input', y: clientPaddle.y });
  }

  draw();
  animId = requestAnimationFrame(loop);
}

function startOnlineGame() {
  lobby.style.display = 'none';
  gameWrap.style.display = 'flex';
  roleBadge.textContent = isHost ? 'VOCÊ CRIOU A SALA (JOGA À ESQUERDA)' : 'VOCÊ ENTROU NA SALA (JOGA À DIREITA)';
  hostPaddle.y = H/2 - PADDLE_H/2;
  clientPaddle.y = H/2 - PADDLE_H/2;
  scoreHost = 0;
  scoreClient = 0;
  updateScoreDisplay();
  if (isHost) resetBall(Math.random() > 0.5 ? 1 : -1);
  hideOverlay();
  running = true;
  loop();
}
</script>

</body>
</html>
